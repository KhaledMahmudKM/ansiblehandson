---
- name: Install nginx
  ansible.builtin.apt:
    name: nginx
    update_cache: true
    cache_valid_time: 3600
- name: No default site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload nginx
- name: The API, a stand-in with fixed JSON answers
  ansible.builtin.template:
    src: api.conf.j2
    dest: /etc/nginx/conf.d/api.conf
  notify: Reload nginx
- name: Make sure nginx is running
  ansible.builtin.service:
    name: nginx
    state: started
