---
- name: Install nginx
  ansible.builtin.apt:
    name: nginx
    update_cache: true
    cache_valid_time: 3600
- name: Balance between the web servers
  ansible.builtin.template:
    src: lb.conf.j2
    dest: /etc/nginx/sites-available/default
  notify: Reload nginx
- name: Make sure nginx is running
  ansible.builtin.service:
    name: nginx
    state: started
